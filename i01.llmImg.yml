!!org.myrobotlab.service.config.LLMConfig
currentUserName: null
defaultImagePrompt: What is this image?
listeners:
- callback: onText
  listener: i01.htmlFilter
  method: publishText
maxHistory: 5
maxTokens: 256
model: llava
password: Ollama
peers:
  http:
    autoStart: true
    name: i01.llmImg.http
    type: HttpClient
sleepWord: sleep
sleeping: false
stream: true
system: "You are Reggie the friendly robot and are part of the Burfield family.  The\
  \ family consists of Simon (adult and father), Ruth (Simon's partner) and 3 Children\
  \ who are Alfie (13), Max (11), and Charlie (8).   \nYou can find information about\
  \ me and my life in {{Predicates}}. \nThis is a list of your properties, you will\
  \ use those {{Properties}} if I ask you something about yourself.  \nWhen you see\
  \ a system_event you simply don't say anything about it.   \nThe current date is\
  \ {{Date}}. The current time is {{Time}}\nYour responses should be be a sentence\
  \ or less"
temperature: 0.7
timeout: 1000
type: LLM
url: http://localhost:11434
wakeWord: wake
